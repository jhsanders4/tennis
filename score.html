<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dionysos Open — Score Entry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Space+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --clay-deep:#8F3B1E; --clay:#C1552E; --clay-light:#F0C6A8; --clay-soft:#F3E4D3;
    --turf:#3E7A46; --turf-deep:#1E3F26; --turf-light:#DCEBD3;
    --cream:#F7F2E7; --card:#FFFDF8; --ink:#221C15; --muted:#9C9686;
    --line:#DCD3BF; --error:#A6302B;
    --font-display:'Fraunces',Georgia,serif;
    --font-body:'Inter',-apple-system,sans-serif;
    --font-mono:'Space Mono','IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;min-height:100vh;
    background:
      radial-gradient(circle at 15% 20%, rgba(62,122,70,0.15), transparent 45%),
      linear-gradient(160deg, var(--clay-deep) 0%, #6E2C15 100%);
    font-family:var(--font-body);
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
  }
  .card{
    background:var(--card);border-radius:14px;width:100%;max-width:360px;
    overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.35);
  }
  .card-head{
    background:var(--turf-deep);
    padding:28px 24px 22px;color:var(--cream);
    border-bottom:3px solid var(--clay);
  }
  .eyebrow{
    font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--turf-light);margin-bottom:8px;
  }
  h1{
    font-family:var(--font-display);font-size:22px;font-weight:700;
    margin:0 0 4px;letter-spacing:-0.01em;
  }
  .sub{font-size:12px;color:rgba(246,241,228,0.65);margin:0;}

  .card-body{padding:24px;}
  label{
    display:block;font-size:11.5px;font-weight:600;
    text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);margin-bottom:8px;
  }
  input[type="password"]{
    width:100%;padding:13px 14px;font-size:16px;font-family:var(--font-mono);
    border:1.5px solid var(--line);border-radius:8px;
    background:var(--cream);color:var(--ink);
    outline:none;transition:border-color .15s, box-shadow .15s;
    -webkit-appearance:none;
  }
  input[type="password"]:focus{
    border-color:var(--clay);
    box-shadow:0 0 0 3px rgba(193,85,46,0.15);
  }
  input[type="password"].shake{
    border-color:var(--error);
    animation:shake .35s ease;
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%,60%{transform:translateX(-6px);}
    40%,80%{transform:translateX(6px);}
  }
  .error-msg{
    font-size:12px;font-weight:600;color:var(--error);
    margin-top:8px;min-height:18px;
  }
  .btn{
    display:block;width:100%;margin-top:18px;
    padding:14px;font-family:var(--font-body);font-weight:700;font-size:14px;
    background:var(--clay);color:var(--cream);
    border:none;border-radius:8px;cursor:pointer;
    transition:background .15s, transform .1s;letter-spacing:.02em;
  }
  .btn:hover{background:var(--clay-deep);}
  .btn:active{transform:scale(.98);}
  .back{
    margin-top:18px;text-align:center;font-size:12px;color:var(--muted);
  }
  .back a{color:var(--clay);text-decoration:none;font-weight:600;}
  .back a:hover{text-decoration:underline;}
</style>
</head>
<body>

<div class="card">
  <div class="card-head">
    <div class="eyebrow">Dionysos Open · 4 Sep 2026</div>
    <h1>Score Entry</h1>
    <p class="sub">Scorekeeper access only — enter the password to update the live bracket.</p>
  </div>
  <div class="card-body">
    <label for="pw">Password</label>
    <input type="password" id="pw" placeholder="••••••••••••"
      autocomplete="current-password" autocorrect="off" autocapitalize="none" autofocus>
    <div class="error-msg" id="errorMsg"></div>
    <button class="btn" id="loginBtn">Enter score entry →</button>
    <div class="back"><a href="./">← Back to bracket</a></div>
  </div>
</div>

<script>
const ADMIN_PASSWORD = 'tennis2026';

function attempt(){
  const input = document.getElementById('pw');
  const errorMsg = document.getElementById('errorMsg');
  if(input.value === ADMIN_PASSWORD){
    sessionStorage.setItem('adminAuth','1');
    window.location.replace('./');
  } else {
    input.classList.remove('shake');
    void input.offsetWidth; // reflow to re-trigger animation
    input.classList.add('shake');
    errorMsg.textContent = 'Incorrect password — try again.';
    input.value = '';
    input.focus();
  }
}

document.getElementById('loginBtn').addEventListener('click', attempt);
document.getElementById('pw').addEventListener('keydown', e => {
  if(e.key === 'Enter') attempt();
  document.getElementById('pw').classList.remove('shake');
  document.getElementById('errorMsg').textContent = '';
});
</script>
</body>
</html>
